<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NxtGen Deal Queue</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --line: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #ff9900;
      --accent-2: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 480px;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
    .tag {
      font-size: 11px; color: var(--accent);
      background: rgba(255,153,0,.12);
      border: 1px solid rgba(255,153,0,.3);
      padding: 2px 7px; border-radius: 10px;
    }
    button {
      font: inherit; cursor: pointer;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 5px 10px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 600; }
    button.ghost { background: transparent; color: var(--muted); }

    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

    .deal {
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
    }
    .deal-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .asin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
    .age { font-size: 11px; margin-left: auto; }
    .age.hot { color: var(--accent-2); font-weight: 600; }
    .age.cold { color: var(--danger); }
    .src { font-size: 11px; color: var(--muted); }

    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .badge {
      font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
      padding: 2px 6px; border-radius: 4px;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    }
    .badge.code { color: var(--accent); border-color: rgba(255,153,0,.4); }

    textarea {
      width: 100%; min-height: 130px; resize: vertical;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 9px; font: inherit; line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    .meta { display: flex; align-items: center; gap: 10px; margin-top: 7px; font-size: 11px; color: var(--muted); }
    .count.over { color: var(--danger); font-weight: 600; }
    .warn { color: var(--danger); }
    .ok { color: var(--accent-2); }

    .actions { display: flex; gap: 6px; margin-top: 9px; }
    .actions .spacer { flex: 1; }

    .link {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; color: var(--accent);
      word-break: break-all; margin-top: 6px;
    }
    .variants { display: flex; gap: 5px; margin-top: 7px; }
    .variants button { padding: 3px 8px; font-size: 11px; }
    .variants button.active { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Deal Queue</h1>
    <span class="tag" id="tagLabel">nxtgenhotdeal-20</span>
    <button class="ghost" id="refreshBtn">Refresh</button>
    <button class="ghost" id="clearBtn">Clear</button>
  </header>

  <div id="list"></div>

  <script src="../config.js"></script>
  <script src="../lib/deal_core.js"></script>
  <script src="../lib/deal_copy.js"></script>
  <script src="deal_queue.js"></script>
</body>
</html>
