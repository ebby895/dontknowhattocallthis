<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account Settings</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 18px; background: #f7f7f7; color: #222; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .email { font-weight:600; color:#111; }
    button { background:#28c55b; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
    button.secondary { background:#ccc; color:#111; }
    footer { margin-top:16px; text-align:right; }
    .ffm-trial-box { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f7f9fc; font-size: 13px; }
    .ffm-trial-status { margin-bottom: 6px; font-weight: 500; }
    .ffm-upgrade-btn { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .ffm-upgrade-btn.pro { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Account</h3>
    <div id="settings-root">
      <div id="ffm-trial-banner"></div>
      <div class="row"><div class="email">Loading...</div></div>
      <div id="ffm-trial-box" class="ffm-trial-box" style="display:none;">
        <div class="ffm-trial-status"></div>
        <button id="ffm-upgrade-btn" class="ffm-upgrade-btn">Upgrade ⚡</button>
      </div>
      <div style="margin-top:8px;">
        <button id="logout-btn">Log out</button>
        <button id="close-btn" class="secondary">Close</button>
      </div>
    </div>
  </div>
  <script type="module" src="settings.js"></script>
  <script type="module" src="settings.js"></script>
</body>
</html>
